name: Weekly SEO & Analytics Report

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) every Monday
    - cron: '30 3 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Automation Script
        env:
          SUPABASE_URI: ${{ secrets.SUPABASE_URI }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          SMTP_RECEIVERS: ${{ secrets.SMTP_RECEIVERS }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/weekly_cron.py
